name: Automated Release & Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  validate-and-package:
    name: Build, Package & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Validate Python Dynamic Inventory
        run: |
          python -m py_compile ansible/inventory/dynamic/issue_inventory.py
          flake8 ansible/inventory/dynamic/issue_inventory.py --max-line-length=120 --ignore=E501
          python ansible/inventory/dynamic/issue_inventory.py --list

      - name: Validate Ansible Playbooks Syntax
        working-directory: ansible
        run: |
          export ANSIBLE_CONFIG=./ansible.cfg
          ansible-playbook playbooks/site.yml --syntax-check -i inventory/hosts.example.yml
          ansible-playbook playbooks/setup_edge_nodes.yml --syntax-check -i inventory/hosts.example.yml
          ansible-playbook playbooks/setup_mongo_cdc.yml --syntax-check -i inventory/hosts.example.yml
          ansible-playbook playbooks/remediate_services.yml --syntax-check -i inventory/hosts.example.yml

      - name: Determine Semantic Version
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          CLEAN_VERSION=$(echo "$TAG" | sed 's/^v//')
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Packaging Release: $TAG (Clean SemVer: $CLEAN_VERSION)"

      - name: Build Distribution Bundle & Checksums
        run: |
          VERSION="${{ steps.versioning.outputs.CLEAN_VERSION }}"
          BUNDLE_NAME="edge-infrastructure-orchestrator-${VERSION}.tar.gz"
          mkdir -p dist
          tar --exclude='.git' --exclude='.github' --exclude='dist' -czvf "dist/${BUNDLE_NAME}" ansible/ docker/ docs/ scripts/ requirements.txt LICENSE README.md
          cd dist
          sha256sum "${BUNDLE_NAME}" > "${BUNDLE_NAME}.sha256"
          cat "${BUNDLE_NAME}.sha256"
          cd ..

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG }}
          name: "Release ${{ steps.versioning.outputs.TAG }} — Production Edge Orchestrator"
          body: |
            ## 🚀 Edge Infrastructure Orchestrator ${{ steps.versioning.outputs.TAG }}
            
            Automated production release generated by CI/CD pipeline.
            
            ### ✨ Highlights:
            - **🛡️ Mutex Concurrency Control:** Dynamic inventory plugin preventing race conditions.
            - **⚙️ Edge Hardening:** Docker memory/CPU quotas & 50MB log rotation for Orange Pi / ARM64.
            - **🔄 Resilient CDC Pipeline:** Apache Kafka + Debezium streaming with immutable audit retention.
            - **🧪 Zero-Defect Quality Gate:** Automated syntax & configuration checks verified.
            
            ### 📦 Distribution Assets:
            - Standalone deployment bundle: `edge-infrastructure-orchestrator-${{ steps.versioning.outputs.CLEAN_VERSION }}.tar.gz`
            - Cryptographic verification: SHA256 checksums included.
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
