# ==============================================================================
# Production Docker Compose Manifest with Enterprise Hardening
# Demonstrating: Log Rotation, Timezone Mounts, Resource Limits, and Healthchecks
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Edge Reverse Proxy (Multi-arch ARM64 / x86_64)
  # ----------------------------------------------------------------------------
  edge_proxy:
    image: nginx:1.27-alpine
    container_name: edge_proxy
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      TZ: "${TZ:-America/Guayaquil}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - proxy_logs:/var/log/nginx
    networks:
      - edge_public_net
      - edge_internal_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Telemetry Web API Service
  # ----------------------------------------------------------------------------
  telemetry_api:
    image: python:3.12-slim
    container_name: telemetry_api
    restart: always
    working_dir: /app
    command: >
      sh -c "python3 -m http.server ${API_SERVICE_PORT:-8080}"
    environment:
      TZ: "${TZ:-America/Guayaquil}"
      PYTHONUNBUFFERED: "1"
      NODE_ENV: "${NODE_ENV:-production}"
      MONGO_URI: "mongodb://${MONGO_APP_USER:-iot_service}:${MONGO_APP_PASSWORD:-AppServiceSecret2026!}@database_primary:27017/${MONGO_DATABASE:-telemetry_production}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${API_SERVICE_PORT:-8080}:${API_SERVICE_PORT:-8080}"
    depends_on:
      database_primary:
        condition: service_healthy
    networks:
      - edge_internal_net
    deploy:
      resources:
        limits:
          cpus: "${APP_API_CPU_LIMIT:-1.0}"
          memory: "${APP_API_MEM_LIMIT:-1G}"
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:${API_SERVICE_PORT:-8080}\")' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Primary Database (MongoDB with Authentication & Volume Isolation)
  # ----------------------------------------------------------------------------
  database_primary:
    image: mongo:7.0
    container_name: database_primary
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      TZ: "${TZ:-America/Guayaquil}"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-SuperSecurePassword2026!}"
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE:-telemetry_production}"
    ports:
      - "${MONGO_PRIMARY_PORT:-27017}:27017"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - primary_db_data:/data/db
      - primary_db_config:/data/configdb
    networks:
      - edge_internal_net
    deploy:
      resources:
        limits:
          cpus: "${PRIMARY_DB_CPU_LIMIT:-1.5}"
          memory: "${PRIMARY_DB_MEM_LIMIT:-2G}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

# ------------------------------------------------------------------------------
# Network Topology
# ------------------------------------------------------------------------------
networks:
  edge_public_net:
    driver: bridge
    name: edge_public_net
  edge_internal_net:
    driver: bridge
    internal: false
    name: edge_internal_net

# ------------------------------------------------------------------------------
# Persistent Volume Stores
# ------------------------------------------------------------------------------
volumes:
  primary_db_data:
    name: primary_db_data
  primary_db_config:
    name: primary_db_config
  proxy_logs:
    name: proxy_logs
