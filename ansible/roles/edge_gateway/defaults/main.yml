---
# Defaults for edge_gateway role
edge_gateway_dir: /opt/edge-gateway
nginx_container_name: edge_proxy
nginx_image: "nginx:1.27-alpine"
edge_http_port: 80
edge_https_port: 443
backend_api_host: "127.0.0.1"
backend_api_port: 8080
proxy_connect_timeout: 10s
proxy_read_timeout: 60s
proxy_send_timeout: 60s
client_max_body_size: 20m
